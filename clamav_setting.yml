---
- name: ClamAV teleport설치 및 log lotate 설정(30일)
  hosts: all
  become: yes

  tasks:
    #  ClamAV 설치
    - name: ClamAV Install (Ubuntu)
      apt:
        name: [clamav, clamav-daemon]
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: ClamAV Install (RHEL)
      dnf:
        name: [clamav, clamd, clamav-update]
        state: present
      when: ansible_os_family == "RedHat"

    #  바이러스 관련 db 업데이트 설정
    - name: Freshclam 가동
      service:
        name: clamav-freshclam
        state: started
        enabled: yes

    #  로그 로테이트 설정 (최대 30일까지 압축되게 설정)
    - name: logroate
      copy:
        dest: /etc/logrotate.d/clamav
        content: |
          /var/log/clamav/daily_scan.log {
              daily
              rotate 30
              compress
              delaycompress
              missingok
              not_if_empty
              create 0660 clamav clamav
          }

    #  스캔 로그 
    - name: 스캔 로그 저장 파일
      file:
        path: /var/log/clamav
        state: directory
        owner: clamav
        group: clamav
        mode: '0750'

   # 03시 자동 스캔 (clamDscan 
    - name: 03시 clamdscan 자동 스캔 
      cron:
        name: "Daily Scan Result"
        minute: "0"
        hour: "3"
        job: >
          nice -n 19 ionice -c 3 /usr/bin/clamdscan 
          --multiscan 
          --fdpass 
          --quiet 
          --log=/var/log/clamav/daily_scan.log 
          --exclude-dir=/sys 
          --exclude-dir=/proc 
          --exclude-dir=/dev 
          --exclude-dir=/var/lib/docker 
          /
    
